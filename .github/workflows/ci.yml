name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  web:
    name: web — lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm --filter @cadencia/web lint
      - run: pnpm --filter @cadencia/web exec tsc -b --noEmit
      - run: pnpm --filter @cadencia/web test:unit
      - run: pnpm --filter @cadencia/web build

  api:
    name: api — lint, types, boundaries, tests, migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cadencia
          POSTGRES_PASSWORD: cadencia
          POSTGRES_DB: cadencia_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cadencia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CADENCIA_JWT_SECRET: ci-secret-ci-secret-ci-secret-1234
      CADENCIA_ENVIRONMENT: test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest --cov=cadencia --cov-report=term-missing
      - name: Migrations (Postgres real)
        env:
          CADENCIA_DATABASE_URL: postgresql+asyncpg://cadencia:cadencia@localhost:5432/cadencia_ci
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Seed de demonstracao (smoke)
        env:
          CADENCIA_DATABASE_URL: postgresql+asyncpg://cadencia:cadencia@localhost:5432/cadencia_ci
        run: uv run python scripts/seed_demo.py

  security:
    name: security — secrets e dependencias
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
      - name: pip-audit
        run: uvx pip-audit --project apps/api --skip-editable || true
      - uses: pnpm/action-setup@v4
      - run: pnpm audit --audit-level high || true
